name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: unzip -q KitchenDesigner.zip

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Patch SceneController
        working-directory: KitchenDesigner
        run: sed -i '/screenSpaceReflectionsOptions/d;/ShadowType/d' app/src/main/java/com/kitchen/designer/engine/SceneController.kt

      - name: Show source
        working-directory: KitchenDesigner
        run: |
          sed -n '80,95p;212,222p' app/src/main/java/com/kitchen/designer/engine/SceneController.kt
          grep -rn "filament" app/build.gradle* gradle/libs.versions.toml 2>/dev/null || true

      - name: Build
        working-directory: KitchenDesigner
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: KitchenDesigner
        run: |
          grep -nE '^e: |error:' build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KitchenDesigner-build
          path: |
            KitchenDesigner/build.log
            KitchenDesigner/app/build/outputs/apk/debug/*.apk
